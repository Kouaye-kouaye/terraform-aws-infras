name: "Infrastructure AgriCam — Terraform CI/CD"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

env:
  TF_VERSION: "~1.7.0"
  AWS_REGION: eu-north-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache

concurrency:
  group: agricam-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────
  # 1. VALIDATION
  # ─────────────────────────────
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Créer le dossier plugin-cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Cache providers Terraform
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -backend=false -input=false -no-color
      - run: terraform fmt -check -recursive
      - run: terraform validate


  # ─────────────────────────────
  # 2. SECURITY — Trivy (rapide, pas de Docker pull)
  # ─────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      # Trivy s'installe en ~5s via le binaire GitHub, pas d'image Docker
      - name: Installer Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 0          # ne bloque pas le pipeline sur les warnings
          severity: HIGH,CRITICAL


  # ─────────────────────────────
  # 3. PLAN
  # ─────────────────────────────
  plan:
    runs-on: ubuntu-latest
    needs: security

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4

      - name: Créer le dossier plugin-cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Cache providers Terraform
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false -no-color

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -parallelism=10 -out=tfplan > plan.txt 2>&1
          EXIT=$?
          set -e

          if [ $EXIT -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ $EXIT -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            cat plan.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            plan.txt


  # ─────────────────────────────
  # 4. DEPLOY
  # ─────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Créer le dossier plugin-cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Cache providers Terraform
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false -no-color

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - run: terraform apply -auto-approve tfplan


  # ─────────────────────────────
  # 5. DRIFT (SCHEDULE ONLY)
  # ─────────────────────────────
  drift:
    runs-on: ubuntu-latest
    needs: [validate, security, plan]
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Créer le dossier plugin-cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Cache providers Terraform
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            tf-providers-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false -no-color

      - name: Détection de drift
        run: |
          set +e
          terraform plan -detailed-exitcode -refresh=true -parallelism=10 > drift.txt 2>&1
          EXIT=$?
          set -e
          cat drift.txt
          if [ $EXIT -eq 2 ]; then
            echo "DERIVE DETECTEE"
            exit 1
          elif [ $EXIT -eq 1 ]; then
            echo "Erreur lors du plan"
            exit 1
          else
            echo "Aucun drift detecte"
          fi