name: "AgriCam — Terraform CI/CD Pipeline"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: "agricam-${{ github.ref }}"
  cancel-in-progress: false

env:
  TF_VERSION: "~1.7.0"
  AWS_REGION: eu-north-1

jobs:

  code-quality:
    name: "Code Quality (fmt · validate · lint)"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: tflint --format compact


  security:
    name: "Sécurité (Checkov)"
    runs-on: ubuntu-latest
    needs: [code-quality]
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false


  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: [security]
    if: github.event_name != 'schedule'
    outputs:
      has_changes: ${{ steps.out.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 🔥 DEBUG CRUCIAL
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan -no-color 2>&1 | tee plan.txt
          EXIT=$?
          set -e
          echo "exit=$EXIT" >> $GITHUB_OUTPUT

      - name: Set output
        id: out
        run: |
          if [ "${{ steps.plan.outputs.exit }}" = "0" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ "${{ steps.plan.outputs.exit }}" = "2" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            plan.txt


  deploy:
    name: "Deploy AWS"
    runs-on: ubuntu-latest
    needs: [plan]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.plan.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: aws sts get-caller-identity

      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - run: terraform apply -auto-approve tfplan


  drift-detection:
    name: "Drift detection"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: aws sts get-caller-identity

      - run: terraform init

      - run: terraform plan -detailed-exitcode -refresh=true