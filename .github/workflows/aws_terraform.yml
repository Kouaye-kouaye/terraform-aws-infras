name: "AgriCam — Terraform CI/CD Pipeline"

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: "agricam-${{ github.ref }}"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_VERSION: "~1.7.0"

# ══════════════════════════════════════════════════════════════
# JOB 1 — QUALITÉ DU CODE (format + validation + lint)
#          Remplace les anciens jobs séparés validate + lint
# ══════════════════════════════════════════════════════════════
jobs:
  code-quality:
    name: "Code Quality (fmt · validate · lint)"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historique complet pour Gitleaks

      # ── Scan secrets ──────────────────────────────────────
      - name: "Gitleaks — Scan de secrets"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Terraform ─────────────────────────────────────────
      - name: "Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "terraform fmt — vérification du format"
        run: terraform fmt -check -recursive

      - name: "terraform init — sans backend"
        run: terraform init -backend=false

      - name: "terraform validate — cohérence syntaxique"
        run: terraform validate

      # ── Lint ──────────────────────────────────────────────
      - name: "Setup TFLint"
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: "TFLint init"
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "TFLint — analyse"
        run: tflint --format compact

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — SÉCURITÉ (Checkov)
  # ══════════════════════════════════════════════════════════════
  security:
    name: "Sécurité (Checkov)"
    runs-on: ubuntu-latest
    needs: [code-quality]
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: "Checkov — scan IaC"
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — PLAN TERRAFORM
  # ══════════════════════════════════════════════════════════════
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: [security]
    if: github.event_name != 'schedule'
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4

      - name: "Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: "Credentials AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: "terraform init"
        run: terraform init

      - name: "terraform plan"
        id: plan
        env:
          TF_VAR_ami_id:         ${{ secrets.TF_VAR_ami_id }}
          TF_VAR_ip_admin:       ${{ secrets.TF_VAR_ip_admin }}
          TF_VAR_ec2_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
          TF_VAR_environnement:  ${{ vars.TF_VAR_environnement }}
          TF_VAR_type_instance:  ${{ vars.TF_VAR_type_instance }}
          TF_VAR_aws_region:     ${{ vars.AWS_REGION }}
        run: |
          set +e
          terraform plan -detailed-exitcode -out=agricam-tfplan -no-color 2>&1 | tee plan-output.txt
          EXIT=${PIPESTATUS[0]}
          set -e

          case $EXIT in
            0) echo "Aucun changement détecté.";  echo "has_changes=false" >> $GITHUB_OUTPUT ;;
            2) echo "Changements détectés.";       echo "has_changes=true"  >> $GITHUB_OUTPUT ;;
            1) echo "Erreur dans le plan !";       exit 1 ;;
          esac

      - name: "Résumé GitHub"
        if: always()
        run: |
          echo "## Plan Terraform AgriCam — \`${{ vars.TF_VAR_environnement }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          grep -E "^(Plan:|  \+|  -|  ~|No changes|Error)" plan-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Sauvegarder l'artefact plan"
        uses: actions/upload-artifact@v4
        with:
          name: "agricam-tfplan-${{ github.sha }}"
          path: |
            agricam-tfplan
            plan-output.txt
          retention-days: 5

  # ══════════════════════════════════════════════════════════════
  # JOB 4 — COMMENTAIRE PR (uniquement sur pull_request)
  # ══════════════════════════════════════════════════════════════
  comment-pr:
    name: "Commentaire Pull Request"
    runs-on: ubuntu-latest
    needs: [plan]
    if: github.event_name == 'pull_request'

    steps:
      - name: "Télécharger l'artefact plan"
        uses: actions/download-artifact@v4
        with:
          name: "agricam-tfplan-${{ github.sha }}"

      - name: "Poster le plan en commentaire"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const plan = fs.readFileSync('plan-output.txt', 'utf8');
            const body = plan.length > 55000
              ? plan.substring(0, 55000) + '\n\n> ⚠️ Plan tronqué — voir les logs GitHub Actions.'
              : plan;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body: [
                '## 📋 Plan Terraform AgriCam — `${{ vars.TF_VAR_environnement }}`',
                '<details><summary>Voir le plan complet</summary>',
                '',
                '```hcl',
                body,
                '```',
                '</details>',
                '',
                `*Commit \`${{ github.sha }}\` — @${{ github.actor }}*`
              ].join('\n')
            });

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — DÉPLOIEMENT (master uniquement, après plan réussi)
  # ══════════════════════════════════════════════════════════════
  deploy:
    name: "Déploiement AWS (terraform apply)"
    runs-on: ubuntu-latest
    needs: [plan]
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.plan.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: "Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Credentials AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: "terraform init"
        run: terraform init

      - name: "Récupérer le plan approuvé"
        uses: actions/download-artifact@v4
        with:
          name: "agricam-tfplan-${{ github.sha }}"

      - name: "terraform apply"
        env:
          TF_VAR_ami_id:         ${{ secrets.TF_VAR_ami_id }}
          TF_VAR_ip_admin:       ${{ secrets.TF_VAR_ip_admin }}
          TF_VAR_ec2_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
          TF_VAR_environnement:  ${{ vars.TF_VAR_environnement }}
          TF_VAR_type_instance:  ${{ vars.TF_VAR_type_instance }}
          TF_VAR_aws_region:     ${{ vars.AWS_REGION }}
        run: terraform apply -auto-approve agricam-tfplan

      - name: "Outputs du déploiement"
        run: |
          echo "## ✅ Déploiement AgriCam réussi !" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 6 — DÉTECTION DE DÉRIVE (cron nocturne)
  # ══════════════════════════════════════════════════════════════
  drift-detection:
    name: "Détection de dérive (schedule nocturne)"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: "Setup Terraform ${{ env.TF_VERSION }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Credentials AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: "terraform init"
        run: terraform init

      - name: "Détecter la dérive"
        id: drift
        env:
          TF_VAR_ami_id:         ${{ secrets.TF_VAR_ami_id }}
          TF_VAR_ip_admin:       ${{ secrets.TF_VAR_ip_admin }}
          TF_VAR_ec2_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
          TF_VAR_environnement:  ${{ vars.TF_VAR_environnement }}
          TF_VAR_type_instance:  ${{ vars.TF_VAR_type_instance }}
          TF_VAR_aws_region:     ${{ vars.AWS_REGION }}
        run: |
          set +e
          terraform plan -detailed-exitcode -refresh=true -no-color 2>&1 | tee drift-report.txt
          echo "code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          set -e
        continue-on-error: true

      - name: "Rapport de dérive"
        run: |
          CODE="${{ steps.drift.outputs.code }}"
          echo "## 🔍 Rapport de dérive — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          if [ "$CODE" = "0" ]; then
            echo "✅ Aucune dérive — infrastructure conforme." >> $GITHUB_STEP_SUMMARY
          elif [ "$CODE" = "2" ]; then
            echo "⚠️ **DÉRIVE DÉTECTÉE** — modifications manuelles hors Terraform." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat drift-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Erreur lors de la détection." >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Échouer si dérive (déclenche alerte GitHub)"
        if: steps.drift.outputs.code == '2'
        run: exit 1