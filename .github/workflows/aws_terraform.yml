name: "Infrastructure AgriCam CI/CD"

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

concurrency:
  group: agricam-terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-north-1
  TF_IN_AUTOMATION: true

jobs:

  # ============================================================
  # JOB 1 — GITLEAKS
  # ============================================================

  scan-secrets:
    name: "Scan Secrets"
    runs-on: ubuntu-latest

    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 2 — VALIDATE
  # ============================================================

  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest

    needs:
      - scan-secrets

    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # ============================================================
  # JOB 3 — TFLINT
  # ============================================================

  lint:
    name: "Terraform Lint"
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --format compact

  # ============================================================
  # JOB 4 — CHECKOV
  # ============================================================

  security-scan:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true

  # ============================================================
  # JOB 5 — TERRAFORM PLAN
  # ============================================================

  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    needs:
      - lint
      - security-scan

    if: github.event_name != 'schedule'

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_ami_id: ${{ secrets.TF_VAR_ami_id }}
          TF_VAR_ip_admin: ${{ secrets.TF_VAR_ip_admin }}
          TF_VAR_ec2_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
          TF_VAR_type_instance: ${{ vars.TF_VAR_type_instance }}
          TF_VAR_aws_region: eu-north-1

        run: |
          set +e

          terraform plan \
            -detailed-exitcode \
            -parallelism=10 \
            -out=agricam-tfplan \
            > plan.txt 2>&1

          EXIT=$?

          echo "exitcode=$EXIT" >> $GITHUB_OUTPUT

          set -e

          if [ $EXIT -eq 0 ]; then
            echo "No infrastructure changes"
          elif [ $EXIT -eq 2 ]; then
            echo "Infrastructure changes detected"
          else
            cat plan.txt
            exit 1
          fi

          cp plan.txt plan-output.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: agricam-tfplan-${{ github.sha }}
          path: |
            agricam-tfplan
            plan-output.txt
          retention-days: 5

  # ============================================================
  # JOB 6 — PR COMMENT
  # ============================================================

  comment-pr:
    name: "PR Terraform Comment"
    runs-on: ubuntu-latest

    needs:
      - plan

    if: github.event_name == 'pull_request'

    steps:
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: agricam-tfplan-${{ github.sha }}

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const fs = require('fs');

            const plan = fs.readFileSync(
              'plan-output.txt',
              'utf8'
            );

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
              ## Terraform Plan

              \`\`\`hcl
              ${plan.substring(0, 60000)}
              \`\`\`
              `
            });

  # ============================================================
  # JOB 7 — DEPLOY
  # ============================================================

  deploy:
    name: "Deploy Infrastructure"
    runs-on: ubuntu-latest

    needs:
      - plan

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: agricam-tfplan-${{ github.sha }}

      - name: Terraform Apply
        env:
          TF_VAR_ami_id: ${{ secrets.TF_VAR_ami_id }}
          TF_VAR_ip_admin: ${{ secrets.TF_VAR_ip_admin }}
          TF_VAR_ec2_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
          TF_VAR_type_instance: ${{ vars.TF_VAR_type_instance }}
          TF_VAR_aws_region: eu-north-1

        run: terraform apply -auto-approve agricam-tfplan

  # ============================================================
  # JOB 8 — DRIFT DETECTION
  # ============================================================

  drift-detection:
    name: "Terraform Drift Detection"
    runs-on: ubuntu-latest

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Drift Check
        id: drift
        run: |
          set +e

          terraform plan \
            -detailed-exitcode \
            -refresh=true \
            -no-color \
            > drift.txt 2>&1

          EXIT=$?

          echo "drift_code=$EXIT" >> $GITHUB_OUTPUT

          cat drift.txt

      - name: Drift Summary
        run: |
          echo "## Terraform Drift Report" >> $GITHUB_STEP_SUMMARY
          cat drift.txt >> $GITHUB_STEP_SUMMARY

      - name: Fail if Drift Exists
        if: steps.drift.outputs.drift_code == '2'
        run: exit