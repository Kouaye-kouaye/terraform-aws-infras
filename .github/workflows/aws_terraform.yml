name: "Infrastructure AgriCam — Terraform CI/CD"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

env:
  TF_VERSION: "~1.7.0"
  AWS_REGION: eu-north-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ─────────────────────────────
# CONCURRENCY FIX
# ─────────────────────────────
concurrency:
  group: agricam-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────
  # VALIDATION
  # ─────────────────────────────
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate


  # ─────────────────────────────
  # SECURITY
  # ─────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform


  # ─────────────────────────────
  # PLAN
  # ─────────────────────────────
  plan:
    runs-on: ubuntu-latest
    needs: security

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan > plan.txt 2>&1
          EXIT=$?
          set -e

          echo "exitcode=$EXIT" >> $GITHUB_OUTPUT

          if [ $EXIT -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ $EXIT -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            cat plan.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            plan.txt


  # ─────────────────────────────
  # DEPLOY
  # ─────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - run: terraform apply -auto-approve tfplan


  # ─────────────────────────────
  # DRIFT DETECTION
  # ─────────────────────────────
  drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init

      - name: Drift detection
        run: |
          set +e
          terraform plan -detailed-exitcode -refresh=true > drift.txt 2>&1
          EXIT=$?
          set -e

          echo "exitcode=$EXIT"

          if [ $EXIT -eq 0 ]; then
            echo "Aucune dérive"
          elif [ $EXIT -eq 2 ]; then
            echo "DERIVE DETECTEE"
            cat drift.txt
            exit 1
          else
            cat drift.txt
            exit 1
          fi