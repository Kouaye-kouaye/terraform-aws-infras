name: "Infrastructure AgriCam CI/CD"

on:
  push:
    branches: [main, dev]

  pull_request:
    branches: [main, dev]

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

concurrency:
  group: "agricam-terraform-${{ github.ref }}"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: eu-north-1

jobs:

  # ============================================================
  # JOB 1 — SECRET SCAN
  # ============================================================

  scan-secrets:
    name: "Scan secrets AWS (Gitleaks)"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # JOB 2 — VALIDATE
  # ============================================================

  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    needs: [scan-secrets]
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # ============================================================
  # JOB 3 — TFLINT
  # ============================================================

  lint:
    name: "TFLint"
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: tflint --format compact

  # ============================================================
  # JOB 4 — CHECKOV
  # ============================================================

  security-scan:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false

  # ============================================================
  # JOB 5 — PLAN
  # ============================================================

  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: [lint, security-scan]
    if: github.event_name != 'schedule'

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_ami_id: ${{ secrets.TF_VAR_ami_id }}
          TF_VAR_ip_admin: ${{ secrets.TF_VAR_ip_admin }}
          TF_VAR_ec2_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
          TF_VAR_type_instance: ${{ vars.TF_VAR_type_instance }}
          TF_VAR_aws_region: eu-north-1

        run: |
          set +e

          terraform plan \
            -detailed-exitcode \
            -parallelism=10 \
            -out=agricam-tfplan \
            > plan.txt 2>&1

          EXIT=$?

          echo "exitcode=$EXIT" >> $GITHUB_OUTPUT

          set -e

          if [ $EXIT -eq 0 ]; then
            echo "No changes"
          elif [ $EXIT -eq 2 ]; then
            echo "Changes detected"
          else
            cat plan.txt
            exit 1
          fi

          cp plan.txt plan-output.txt

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: agricam-tfplan-${{ github.sha }}
          path: |
            agricam-tfplan
            plan-output.txt

  # ============================================================
  # JOB 6 — COMMENT PR
  # ============================================================

  comment-pr:
    name: "PR Comment"
    runs-on: ubuntu-latest
    needs: [plan]

    if: github.event_name == 'pull_request'

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: agricam-tfplan-${{ github.sha }}

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const plan = fs.readFileSync(
              'plan-output.txt',
              'utf8'
            );

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
              ## Terraform Plan

              \`\`\`hcl
              ${plan.substring(0, 60000)}
              \`\`\`
              `
            });

  # ============================================================
  # JOB 7 — DEPLOY
  # ============================================================

  deploy:
    name: "Deploy Terraform"
    runs-on: ubuntu-latest
    needs: [plan]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: agricam-tfplan-${{ github.sha }}

      - name: Terraform Apply
        env:
          TF_VAR_ami_id: ${{ secrets.TF_VAR_ami_id }}
          TF_VAR_ip_admin: ${{ secrets.TF_VAR_ip_admin }}
          TF_VAR_ec2_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
          TF_VAR_type_instance: ${{ vars.TF_VAR_type_instance }}
          TF_VAR_aws_region: eu-north-1

        run: terraform apply -auto-approve agricam-tfplan

  # ============================================================
  # JOB 8 — DRIFT DETECTION
  # ============================================================

  drift-detection:
    name: "Drift Detection"
    runs-on: ubuntu-latest

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - run: terraform init

      - name: Drift Check
        id: drift
        run: |
          set +e

          terraform plan \
            -detailed-exitcode \
            -refresh=true \
            -no-color \
            > drift.txt 2>&1

          EXIT=$?

          echo "drift_code=$EXIT" >> $GITHUB_OUTPUT

          cat drift.txt

      - name: Summary
        run: |
          echo "## Drift Report" >> $GITHUB_STEP_SUMMARY
          cat drift.txt >> $GITHUB_STEP_SUMMARY

      - name: Fail if drift detected
        if: steps.drift.outputs.drift_code == '2'
        run: exit 1