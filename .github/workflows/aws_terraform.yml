name: "Infrastructure AgriCam — Terraform CI/CD"

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'

env:
  TF_VERSION: "~1.7.0"
  AWS_REGION: eu-north-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: agricam-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ─────────────────────────────
  # 1. VALIDATION
  # ─────────────────────────────
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate


  # ─────────────────────────────
  # 2. SECURITY
  # ─────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      # CORRECTION 4 : épinglé sur un tag fixe au lieu de @master
      # @master peut casser le pipeline sans prévenir
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform


  # ─────────────────────────────
  # 3. PLAN (SINGLE SOURCE OF TRUTH)
  # ─────────────────────────────
  plan:
    runs-on: ubuntu-latest
    needs: security

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -detailed-exitcode -out=tfplan > plan.txt 2>&1
          EXIT=$?

          if [ $EXIT -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elif [ $EXIT -eq 2 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            cat plan.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            plan.txt


  # ─────────────────────────────
  # 4. DEPLOY (SAFE APPLY)
  # ─────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/master' && needs.plan.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # CORRECTION 2 : terraform init AVANT de télécharger l'artifact
      # Les providers doivent être installés avant que apply puisse les utiliser
      - run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - run: terraform apply -auto-approve tfplan


  # ─────────────────────────────
  # 5. DRIFT (SCHEDULE ONLY)
  # ─────────────────────────────
  drift:
    runs-on: ubuntu-latest
    # CORRECTION 1 : drift doit attendre que plan (et ses dépendances) soient terminés
    # Sans ça, drift peut tourner en parallèle de plan/deploy sur le même state
    needs: [validate, security, plan]
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init

      # CORRECTION 3 : on capture le code de sortie correctement
      # "|| true" masquait les drifts réels → le job ne signalait jamais d'anomalie
      - name: Detect drift
        id: drift
        run: |
          terraform plan -detailed-exitcode -refresh=true > drift.txt 2>&1
          EXIT=$?
          cat drift.txt
          if [ $EXIT -eq 2 ]; then
            echo "⚠️ DRIFT DÉTECTÉ : l'infrastructure a divergé du code Terraform."
            exit 1
          elif [ $EXIT -eq 1 ]; then
            echo "❌ Erreur lors du plan de drift."
            exit 1
          else
            echo "✅ Aucun drift détecté."
          fi